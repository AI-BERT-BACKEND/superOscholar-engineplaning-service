services:
  mongo:
    image: mongo:7
    container_name: engineplaning-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}

    ports:
      - "5439:27017"

    volumes:
      - engineplaning_mongo_data:/data/db

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: engineplaning-service
    restart: unless-stopped

    ports:
      - "8087:8080"

    environment:
      MONGO_URI: ${MONGO_URI}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      FEIGN_TASK_SERVICE_URL: ${FEIGN_TASK_SERVICE_URL}
      FEIGN_PROFILE_SERVICE_URL: ${FEIGN_PROFILE_SERVICE_URL}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mongo:
        condition: service_healthy

volumes:
  engineplaning_mongo_data: