services:
  mongo:
    image: mongo:7
    container_name: engineplaning-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}

    ports:
      - "5439:27017"

    volumes:
      - engineplaning_mongo_data:/data/db

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dosw-network

  engineplanning-service:
    build: .
    container_name: engineplanning-service
    restart: unless-stopped

    ports:
      - "1504:1504"

    environment:
      SERVER_PORT: 1504
      MONGO_URI: ${MONGO_URI}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      FEIGN_TASK_SERVICE_URL: ${FEIGN_TASK_SERVICE_URL}
      FEIGN_PROFILE_SERVICE_URL: ${FEIGN_PROFILE_SERVICE_URL}
      FEIGN_ACADEMIC_SERVICE_URL: ${FEIGN_ACADEMIC_SERVICE_URL}
      FEIGN_RECOMMENDATION_SERVICE_URL: ${FEIGN_RECOMMENDATION_SERVICE_URL}
      FEIGN_PLANNING_SERVICE_URL: ${FEIGN_PLANNING_SERVICE_URL}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - dosw-network

volumes:
  engineplaning_mongo_data:

# ─── Red compartida DOSW ───────────────────────────────────────────────────────
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  NOMBRE DEL CONTENEDOR DE ESTE SERVICIO: engineplanning-service            │
# │  PUERTO INTERNO:  1504                                                      │
# │  RED DOCKER:      dosw-network                                              │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# ─── Cómo conectar otro servicio a este motor en Docker ──────────────────────
#
# 1. En el docker-compose.yml del otro servicio añade al final:
#
#      networks:
#        dosw-network:
#          external: true
#
# 2. En la definición del servicio añade:
#
#      networks:
#        - dosw-network
#
# 3. Usa la URL:  http://engineplanning-service:1504
#    (no localhost — entre contenedores se usa el nombre del contenedor)
#
# ─── Variables para planning-service (puerto 1505) ───────────────────────────
#   planning-service usa estos Feign clients para llamar a este motor:
#     · PlanningFeignClient  → GET  /planning/prioritization
#     · PlanningFeignClient  → POST /planning/distribution
#     · EnginePlanningClient → POST /planning/recommendations/critical
#
#   Variable que planning-service debe configurar:
#     En Docker:  ENGINE_PLANNING_URL=http://engineplanning-service:1504
#     En local:   ENGINE_PLANNING_URL=http://localhost:1504
#
# ─── Variables para recommendation-service (puerto 8086) ─────────────────────
#   recommendation-service usa estos Feign clients para llamar a este motor:
#     · PlanningFeignClient  → GET  /planning/prioritization
#     · PlanningFeignClient  → POST /planning/distribution
#     · EnginePlanningClient → POST /planning/recommendations/critical
#
#   Variable que recommendation-service debe configurar:
#     En Docker:  ENGINE_PLANNING_URL=http://engineplanning-service:1504
#     En local:   ENGINE_PLANNING_URL=http://localhost:1504
#
#   Nota: FEIGN_RECOMMENDATION_SERVICE_URL en este docker-compose es para
#   llamadas SALIENTES de este motor hacia recommendation-service (uso futuro).
networks:
  dosw-network:
    name: dosw-network
    driver: bridge