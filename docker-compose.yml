services:
  mongo:
    image: mongo:7
    container_name: engineplaning-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}

    ports:
      - "5439:27017"

    volumes:
      - engineplaning_mongo_data:/data/db

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dosw-network

  engineplanning-service:
    build: .
    container_name: engineplanning-service
    restart: unless-stopped

    ports:
      - "1504:1504"

    environment:
      SERVER_PORT: 1504
      MONGO_URI: ${MONGO_URI}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      FEIGN_TASK_SERVICE_URL: ${FEIGN_TASK_SERVICE_URL}
      FEIGN_PROFILE_SERVICE_URL: ${FEIGN_PROFILE_SERVICE_URL}
      FEIGN_ACADEMIC_SERVICE_URL: ${FEIGN_ACADEMIC_SERVICE_URL}
      FEIGN_RECOMMENDATION_SERVICE_URL: ${FEIGN_RECOMMENDATION_SERVICE_URL}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - dosw-network

volumes:
  engineplaning_mongo_data:

# ─── Red compartida DOSW ───────────────────────────────────────────────────────
# Para conectar recommendation-service en Docker, añade en su docker-compose.yml:
#
#   networks:
#     dosw-network:
#       external: true
#
# Y agrega a su servicio:
#   networks:
#     - dosw-network
#
# En local (sin Docker): recommendation-service llama a http://localhost:8087
# En Docker: recommendation-service llama a http://engineplanning-service:1504
# Y usa: PLANNING_SERVICE_URL=http://engineplanning-service:1504
networks:
  dosw-network:
    name: dosw-network
    driver: bridge