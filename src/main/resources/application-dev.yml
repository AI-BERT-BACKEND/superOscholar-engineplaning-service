spring:
  config:
    activate:
      on-profile: dev
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true  # activa los fallbacks

jwt:
  secret: "VmVyeVNlY3JldEtleUZvckFJQmVydEFwcGxpY2F0aW9uQXV0aGVudGljYXRpb24="

feign:
  task-service:
    url: "http://localhost:8084"    # puerto correcto de task-service
  profile-service:
    url: "http://localhost:8082"    # puerto de profile-service
  academic-service:
    url: "http://localhost:8083"    # puerto de academic-service
  recommendation-service:
    url: "http://localhost:8086"    # puerto de recommendation-service
  planning-service:
    url: "http://localhost:1505"    # puerto de planning-service
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: FULL

# ─── Resilience4j ─────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      task-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
      profile-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
      academic-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true      planning-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.aibert.dosw: DEBUG
    feign: DEBUG
    org.springframework.security: INFO
    io.github.resilience4j: DEBUG
