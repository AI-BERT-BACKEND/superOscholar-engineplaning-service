spring:
  config:
    activate:
      on-profile: local

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: "VmVyeVNlY3JldEtleUZvckFJQmVydEFwcGxpY2F0aW9uQXV0aGVudGljYXRpb24="

# ─── Seguridad: desactiva JWT para pruebas Swagger locales ───────────────────
# WARNING: nunca usar en prod/qa
planning:
  security:
    enabled: false

# ─── URLs de servicios externos (locales) ────────────────────────────────────
feign:
  task-service:
    url: "http://localhost:8084"
  profile-service:
    url: "http://localhost:8082"
  academic-service:
    url: "http://localhost:8083"
  recommendation-service:
    url: "http://localhost:1505"
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: FULL

# ─── Resilience4j ─────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      task-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
      profile-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
      academic-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true      planning-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# ─── SpringDoc / Swagger UI ───────────────────────────────────────────────────
springdoc:
  swagger-ui:
    try-it-out-enabled: true        # abre directamente en modo "prueba"
    operations-sorter: alpha        # endpoints en orden alfabético
    tags-sorter: alpha
    display-request-duration: true  # muestra el tiempo de respuesta
  show-actuator: false

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.aibert.dosw: DEBUG
    feign: DEBUG
    org.springframework.security: INFO
    io.github.resilience4j: DEBUG
