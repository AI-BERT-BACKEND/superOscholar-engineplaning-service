server:
  port: 8087

spring:
  application:
    name: engineplanning-service

feign:
  task-service:
    url: ${FEIGN_TASK_SERVICE_URL}

  profile-service:
    url: ${FEIGN_PROFILE_SERVICE_URL}

jwt:
  secret: ${JWT_SECRET}

planning:
  priority:
    weight-proximity: 0.40
    weight-academic: 0.35
    weight-time: 0.25

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prod