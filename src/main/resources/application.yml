server:
  port: 8087

spring:
  application:
    name: engineplanning-service

feign:
  task-service:
    url: ${FEIGN_TASK_SERVICE_URL}

  profile-service:
    url: ${FEIGN_PROFILE_SERVICE_URL}

  academic-service:
    url: ${FEIGN_ACADEMIC_SERVICE_URL}

  recommendation-service:
    url: ${FEIGN_RECOMMENDATION_SERVICE_URL}

jwt:
  secret: ${JWT_SECRET}

planning:
  priority:
    weight-proximity: 0.40
    weight-academic: 0.40
    weight-time: 0.20

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{requestId:-no-req}] %-5level %logger{36} - %msg%n"
  level:
    com.aibert.dosw: INFO
    feign: WARN

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prod